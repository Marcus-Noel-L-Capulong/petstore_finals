databases:
  # 1. PostgreSQL Database
  - name: petstore-db
    plan: free

services:
  # 2. Spring Boot Backend
  - type: web
    name: petstore-backend
    env: docker
    plan: free
    region: ohio
    rootDir: backend
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: petstore-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: petstore-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: petstore-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: petstore-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: petstore-db
          property: password
      - key: DB_DRIVER
        value: "org.postgresql.Driver"
      - key: PORT
        value: "8080"

  # 3. React Frontend
  - type: web
    name: petstore-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: petstore-backend
          property: host
