databases:
  # 1. PostgreSQL Database
  - name: petstore-db
    plan: free

services:

  # 2. Spring Boot Backend
  - type: web
    name: petstore-backend
    env: docker
    plan: free
    region: ohio
    rootDir: backend
    envVars:
      - key: DB_URL
        fromDatabase:
          name: petstore-db
          property: connectionString
      - key: PORT
        value: "8080"
    
  # 3. React Frontend
  - type: web
    name: petstore-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: petstore-backend
          property: host
